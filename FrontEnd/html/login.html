<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IoT Smart Home Control System - Đăng nhập hệ thống điều khiển nhà thông minh">
  <title>IoT - Đăng nhập</title>
  
  <!-- Kết nối font chữ Inter từ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Nhúng file CSS giao diện đăng nhập -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <!-- Container tổng thể của trang đăng nhập (bố cục 2 cột) -->
  <div class="login-page">
    
    <!-- Cột bên trái: Giới thiệu thương hiệu & tính năng nổi bật -->
    <div class="login-left">
      <!-- Logo và tiêu đề hệ thống -->
      <div class="login-brand">
        <h1>IoT</h1>
        <p class="subtitle">Smart Home Control System</p>
      </div>
      <!-- Danh sách các tính năng chính của hệ thống -->
      <div class="login-features">
        <div class="feature-item">Giám sát nhiệt độ &amp; độ ẩm</div>
        <div class="feature-item">Điều khiển thiết bị thông minh</div>
        <div class="feature-item">Thống kê &amp; lịch sử hoạt động</div>
      </div>
    </div>

    <!-- Cột bên phải: Form đăng nhập của người dùng -->
    <div class="login-right">
      <div class="login-form-container">
        <h2>Đăng nhập</h2>
        <p class="form-subtitle">Nhập thông tin để truy cập hệ thống</p>

        <!-- Khung hiển thị thông báo lỗi (ẩn mặc định, kích hoạt bởi JS khi sai tài khoản) -->
        <div id="loginError" class="login-error">
          Tên đăng nhập hoặc mật khẩu không đúng
        </div>

        <!-- Form nhập thông tin đăng nhập -->
        <form id="loginForm" autocomplete="off">
          <!-- Nhóm nhập Tên đăng nhập -->
          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <div class="input-wrapper">
              <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required>
            </div>
          </div>

          <!-- Nhóm nhập Mật khẩu kèm nút Ẩn/Hiện -->
          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
              <button type="button" class="btn-toggle-password" id="togglePassword">Hiện</button>
            </div>
          </div>

          <!-- Nút gửi form đăng nhập -->
          <button type="submit" class="btn-login" id="btnLogin">Đăng nhập</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Nhúng script API và xử lý logic đăng nhập -->
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
