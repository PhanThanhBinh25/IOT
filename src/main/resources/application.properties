# =============================================
# APPLICATION
# =============================================
spring.application.name=iot-smarthome
server.port=8080

# =============================================
# DATABASE - MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/iot_system?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=280825
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# MQTT BROKER
# =============================================
mqtt.broker.url=tcp://localhost:1884
mqtt.broker.username=iotuser
mqtt.broker.password=b23dccn086
mqtt.broker.client-id=springboot-iot-backend
mqtt.broker.keep-alive=60

# MQTT Topics - Subscribe (nh\u1eadn t\u1eeb ESP32)
mqtt.topic.sensor.temperature=iot/sensor/temperature
mqtt.topic.sensor.humidity=iot/sensor/humidity
mqtt.topic.sensor.light=iot/sensor/light
mqtt.topic.device.state.led1=iot/led1/state
mqtt.topic.device.state.led2=iot/led2/state
mqtt.topic.device.state.led3=iot/led3/state

# MQTT Topics - Publish (g\u1eedi l\u1ec7nh \u0111\u1ebfn ESP32)
mqtt.topic.device.cmd.led1=iot/led1/set
mqtt.topic.device.cmd.led2=iot/led2/set
mqtt.topic.device.cmd.led3=iot/led3/set
mqtt.topic.device.cmd.ledall=iot/ledall/set

# =============================================
